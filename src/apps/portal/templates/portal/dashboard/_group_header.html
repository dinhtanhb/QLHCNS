<header class="home-group-header">
<h2 id="group-{{ key }}-title">{{ title }}</h2>
<div class="home-header-actions">{% if create %}<a href="{{ create.href }}" class="ui-button ui-button--secondary">{{ create.label }}</a>{% endif %}{% if create2 %}<a href="{{ create2.href }}" class="ui-button ui-button--secondary">{{ create2.label }}</a>{% endif %}{% if link %}<a href="{{ link }}" class="home-text-link">{{ link_label }} →</a>{% endif %}</div>
</header>
