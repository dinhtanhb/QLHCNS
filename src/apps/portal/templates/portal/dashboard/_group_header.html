<header class="ui-section-header">
<h2 id="group-{{ key }}-title">{{ title }}</h2>
<div class="ui-header-actions ui-action-cluster">{% if create %}<a href="{{ create.href }}" class="ui-button ui-button--primary">{{ create.label }}</a>{% endif %}{% if create2 %}<a href="{{ create2.href }}" class="ui-link-action">{{ create2.label }}</a>{% endif %}{% if link %}<a href="{{ link }}" class="ui-link-action">{{ link_label }}</a>{% endif %}</div>
</header>
