{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Phân trang" class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm">
    <span class="text-gray-600">Trang {{ page_obj.number|ui_number }}/{{ page_obj.paginator.num_pages|ui_number }} · {{ page_obj.paginator.count|ui_number }} mục</span>
    <div class="flex gap-4">
        {% if page_obj.has_previous %}<a class="text-blue-700 underline" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Trang trước</a>{% endif %}
        {% if page_obj.has_next %}<a class="text-blue-700 underline" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Trang sau</a>{% endif %}
    </div>
</nav>
{% endif %}
