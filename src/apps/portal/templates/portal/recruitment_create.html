{% extends "base.html" %}
{% block title %}Đề xuất tuyển dụng{% endblock %}
{% block content %}
<div class="max-w-lg bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-lg font-bold text-gray-900 mb-4">Tạo đề xuất tuyển dụng</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mã đề xuất</label>
            <input type="text" name="request_code" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phòng ban</label>
            <select name="department" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for d in departments %}<option value="{{ d.id }}">{{ d.department_name|ui_number }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Vị trí cần tuyển</label>
            <select name="position" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for p in positions %}<option value="{{ p.id }}">{{ p.position_name|ui_number }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Số lượng cần</label>
            <input type="number" name="required_quantity" min="1" value="1" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày cần có người</label>
            <input type="date" name="required_date" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Lý do tuyển dụng</label>
            <textarea name="request_reason" rows="3" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-md transition">Gửi đề xuất</button>
            <a href="{% url 'portal:recruitment_list' %}" class="text-gray-500 hover:text-gray-700 px-5 py-2.5">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
