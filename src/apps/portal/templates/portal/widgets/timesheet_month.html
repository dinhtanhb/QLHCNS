{% load ui_components l10n %}
{% if widget_key == "f0" %}
<label for="timesheet-work-date">Ngày làm việc <span class="ui-required" aria-hidden="true">*</span></label><input id="timesheet-work-date" type="date" name="work_date" required value="{{ year|ui_year }}-{{ month|stringformat:'02d' }}-01" min="{{ year|ui_year }}-{{ month|stringformat:'02d' }}-01"><p class="ui-field-error" id="timesheet-work-date-error" hidden></p>
{% elif widget_key == "f1" %}
<label for="timesheet-project">Dự án</label><select id="timesheet-project" name="project"><option value="">-- Không thuộc dự án --</option>{% for p in projects %}<option value="{{ p.id }}">{{ p.project_name }}</option>{% endfor %}</select>
{% elif widget_key == "f2" %}

                    <label for="timesheet-sick-days" class="ui-field-label">Số ngày nghỉ ốm trong tháng:</label>
                    <input id="timesheet-sick-days" type="number" step="0.5" name="sick_days" value="{{ summary.sick_days|unlocalize }}" class="timesheet-leave-input">

{% elif widget_key == "f3" %}

                    <label for="timesheet-maternity-days" class="ui-field-label">Số ngày thai sản trong tháng:</label>
                    <input id="timesheet-maternity-days" type="number" step="0.5" name="maternity_days" value="{{ summary.maternity_days|unlocalize }}" class="timesheet-leave-input">

{% elif widget_key == "f4" %}

                    <label for="timesheet-compensatory-days" class="ui-field-label">Số ngày nghỉ bù trong tháng:</label>
                    <input id="timesheet-compensatory-days" type="number" step="0.5" name="compensatory_days" value="{{ summary.compensatory_days|unlocalize }}" class="timesheet-leave-input">

{% elif widget_key == "f5" %}

                    <label for="timesheet-annual-leave-days" class="ui-field-label">Số ngày nghỉ phép trong tháng:</label>
                    <input id="timesheet-annual-leave-days" type="number" step="0.5" name="annual_leave_days" value="{{ summary.annual_leave_days|unlocalize }}" class="timesheet-leave-input">

{% elif widget_key == "f6" %}

                    <label for="timesheet-unpaid-leave-days" class="ui-field-label">Số ngày nghỉ không lương trong tháng:</label>
                    <input id="timesheet-unpaid-leave-days" type="number" step="0.5" name="unpaid_leave_days" value="{{ summary.unpaid_leave_days|unlocalize }}" class="timesheet-leave-input">

{% endif %}
