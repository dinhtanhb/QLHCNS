{% extends "base.html" %}
{% block title %}Tạo hợp đồng{% endblock %}
{% block content %}
<div class="max-w-lg bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-lg font-bold text-gray-900 mb-4">Tạo hợp đồng lao động</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Nhân viên</label>
            <select name="employee" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for e in employees %}<option value="{{ e.id }}" {% if e.pk|stringformat:"s" == selected_employee %}selected{% endif %}>{{ e.employee_code|ui_number }} - {{ e.full_name|ui_number }}</option>{% endfor %}
            </select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Loại hợp đồng</label>
            <select name="contract_type" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for t in contract_types %}<option value="{{ t.id }}">{{ t.contract_type_name|ui_number }}</option>{% endfor %}
            </select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Số hợp đồng</label>
            <input type="text" name="contract_no" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"></div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Ngày bắt đầu</label>
                <input type="date" name="start_date" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Ngày kết thúc</label>
                <input type="date" name="end_date" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                <p class="text-xs text-gray-400 mt-1">Để trống nếu là hợp đồng không xác định thời hạn</p></div>
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Lương cơ bản</label>
            <input type="number" name="basic_salary" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
            <select name="status" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                <option value="Draft">Nháp</option><option value="Active">Đang hiệu lực</option>
            </select></div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-md transition">Lưu</button>
            <a href="{% url 'portal:hr_contract_list' %}" class="text-gray-500 hover:text-gray-700 px-5 py-2.5">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
