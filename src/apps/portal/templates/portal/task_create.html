{% extends "base.html" %}
{% block title %}Giao việc mới{% endblock %}
{% block content %}
<div class="max-w-lg bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-lg font-bold text-gray-900 mb-4">Giao việc mới</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mã công việc</label>
            <input type="text" name="task_code" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tên công việc</label>
            <input type="text" name="task_name" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
            <textarea name="description" rows="3" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Giao cho nhân viên</label>
            <select name="assigned_to_employee" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for e in candidates %}
                <option value="{{ e.id }}">{{ e.employee_code }} - {{ e.full_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Độ ưu tiên</label>
            <select name="priority" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                <option value="Low">Thấp</option>
                <option value="Normal" selected>Bình thường</option>
                <option value="High">Cao</option>
                <option value="Urgent">Khẩn cấp</option>
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày bắt đầu</label>
                <input type="date" name="start_date" value="{{ today|date:'Y-m-d' }}" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Hạn hoàn thành</label>
                <input type="date" name="due_date" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-md transition">Giao việc</button>
            <a href="{% url 'portal:task_list' %}" class="text-gray-500 hover:text-gray-700 px-5 py-2.5">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
