{% extends "base.html" %}
{% block title %}Thông báo{% endblock %}
{% block content %}
<h1 class="text-lg font-bold text-gray-900 mb-4">Thông báo của tôi</h1>
<div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100">
    {% for n in items %}
    <a href="{{ n.link|default:'#' }}" class="block px-6 py-4 hover:bg-gray-50 {% if not n.is_read %}bg-blue-50{% endif %}">
        <p class="font-medium text-gray-900 text-sm">{{ n.title }}</p>
        <p class="text-gray-500 text-sm">{{ n.message }}</p>
        <p class="text-gray-400 text-xs mt-1">{{ n.created_date|date:"d/m/Y H:i" }}</p>
    </a>
    {% empty %}
    <p class="px-6 py-8 text-center text-gray-400">Không có thông báo nào.</p>
    {% endfor %}
</div>
{% endblock %}
