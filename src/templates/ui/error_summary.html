<div class="ui-error-summary" data-ui-errors tabindex="-1"{% if not form.errors %} hidden{% endif %}><h2>Kiểm tra thông tin đã nhập</h2><ul>{% if form %}{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}{% endif %}</ul></div>
