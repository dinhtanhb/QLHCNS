<div class="ui-card ui-kpi{% if danger and value > 0 %} ui-kpi--danger{% endif %}"><span class="ui-kpi-label">{{ label }}</span><strong class="ui-kpi-value">{% if value == None %}Chưa có dữ liệu{% else %}{{ value|ui_number }}{% endif %}</strong>{% if danger and value > 0 %}<span class="ui-kpi-note">{% include "_shell_icon.html" with name="danger" %}Cần xử lý</span>{% endif %}</div>
