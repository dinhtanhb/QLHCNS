<input id="{{ id }}" name="{{ name }}" type="text" value="{{ value|default_if_none:'' }}" list="{{ id }}-choices"{% if required %} required{% endif %}{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if help or error %} aria-describedby="{% if help %}{{ id }}-help{% endif %}{% if help and error %} {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}{% if error %} aria-invalid="true"{% endif %}>
<datalist id="{{ id }}-choices">{% for choice in choices %}<option value="{{ choice }}"></option>{% endfor %}</datalist>
