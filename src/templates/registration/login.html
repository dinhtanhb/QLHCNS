{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-1">Đăng nhập</h1>
    <p class="text-sm text-gray-500 mb-6">Cổng thông tin nhân viên IHRMS</p>
    {% if form.errors %}
        <div class="mb-4 px-4 py-3 rounded-md text-sm bg-red-50 text-red-800 border border-red-200">
            Sai tên đăng nhập hoặc mật khẩu.
        </div>
    {% endif %}
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
            <input type="text" name="username" required
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
            <input type="password" name="password" required
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-md transition">
            Đăng nhập
        </button>
    </form>
</div>
{% endblock %}
